name: evpnl3

topology:
  nodes:
    switch:
      kind: cumulus_cvx
      image: networkop/cx:5.3.0
      runtime: docker
      cpu: 1.5
      memory: 2g
      binds:
        - switch/setup.sh:/setup.sh
    dpu:
      kind: cumulus_cvx
      image: networkop/cx:5.3.0
      runtime: docker
      cpu: 1.5
      memory: 2g
      binds:
        - dpu/setup.sh:/setup.sh

    acmswitch:
      kind: bridge

    acmdefaultgw:
      kind: linux
      image: praqma/network-multitool:latest
      cpu: 0.25
      memory: 256m
      binds:
        - acmdefaultgw/setup.sh:/setup.sh
      cmd: bash /setup.sh

    tenant:
      kind: linux
      image: praqma/network-multitool:latest
      cpu: 0.25
      memory: 256m
      binds:
        - tenant/setup.sh:/setup.sh
      cmd: bash /setup.sh

    acm:
      kind: linux
      image: praqma/network-multitool:latest
      cpu: 0.25
      memory: 256m
      binds:
        - acm/setup.sh:/setup.sh
      cmd: bash /setup.sh

  links:
    - endpoints: ["switch:swp1", "dpu:swp1"]
    - endpoints: ["switch:swp2", "dpu:swp2"]
    - endpoints: ["switch:swp3", "acmswitch:swp1"]
    - endpoints: ["acmswitch:swp2", "acm:eth1"]
    - endpoints: ["acmswitch:swp3", "acmdefaultgw:eth1"]
    - endpoints: ["tenant:eth1", "dpu:swp3"]
    - endpoints: ["tenant:eth2", "dpu:swp4"]
